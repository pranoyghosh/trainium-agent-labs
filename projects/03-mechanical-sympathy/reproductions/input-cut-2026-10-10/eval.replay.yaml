debug: false
save_zarr: true
disk_mode: true
ckpt_path: null
num_model_steps_forward: 25
backend: auto
experiment:
  name: samudra_om4_v2_eval
  rand_seed: 15
  base_output_dir: .LOCAL
  data_root: /amogh/samudra-one-degree
  wandb:
    mode: disabled
    project: default
    entity: ocean_emulators
    group: null
    tags: null
    notes: null
  search: null
data:
  sources:
  - type: om4
    train_time:
      start: '1975-01-03'
      end: '2013-10-05'
    val_time:
      start: '2013-10-05'
      end: '2014-10-05'
    inference_time:
      start: '2014-10-10'
      end: '2022-12-24'
    data_location: /amogh/samudra-one-degree/data/om4_onedeg/OM4.zarr
    data_means_location: /amogh/samudra-one-degree/data/om4_onedeg/OM4_means.zarr
    data_stds_location: /amogh/samudra-one-degree/data/om4_onedeg/OM4_stds.zarr
    prognostic_vars_key: thermo_dynamic_all
    boundary_vars_key: tau_hfds_hfds_anom
    grid_type: gaussian
  loading:
    type: cpu
    num_workers: 4
    persistent_workers: true
    pin_mem: true
    concurrent_compute: true
  inference_loading:
    num_workers: 4
    persistent_workers: true
  input_steps: 2
  output_steps: 2
  loader_version: om4-torch
  normalize_before_mask: true
  masked_fill_value: 0.0
model:
  pred_residuals: false
  last_kernel_size: 3
  pad: circular
  checkpointing: all
  gradient_detach_interval: 0
  add_3d_coordinates: false
  unet:
    ch_width:
    - 280
    - 380
    - 480
    - 520
    dilation:
    - 1
    - 2
    - 4
    - 8
    n_layers:
    - 1
    - 1
    - 1
    - 1
    core_block:
      block_type: conv_next_block
      kernel_size: 3
      activation: capped_gelu
      upscale_factor: 2
      norm: batch
      pointwise_linear: false
    down_sampling_block: avg_pool
    up_sampling_block: zonally_periodic_upsample
    drop_path_rate: 0.0
  pos_channels: 0
  use_bfloat16: false
observations: null
